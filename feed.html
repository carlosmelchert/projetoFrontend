<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed de Atualizações</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="telacheia centralizado">  
    <div class="lista">
      
      <div class="titulo">
        <h2>Feed de Atualizações</h2>
      </div>

      <div class="painel-filtros">
        <input type="text" id="filtro-busca" placeholder="Buscar por ID, Título ou Data (ex: 25/10/2026)...">
        
        <select id="filtro-area">
          <option value="">Todas as Áreas</option>
          <option value="GI & Fin">GI & Fin</option>
          <option value="Pessoas">Pessoas</option>
          <option value="Projetos">Projetos</option>
          <option value="Marketing">Marketing</option>
          <option value="Mercado">Mercado</option>
        </select>
      </div>

      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Título</th>
              <th>Prévia do Conteúdo</th>
              <th>Áreas</th>
              <th>Data</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="6" style="text-align: center; color: #666;">
                Nenhuma atualização encontrada.
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="rodape-acoes">
        <a href="criar-atualizacao.html" class="btn-acessar">Criar atualização</a>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
